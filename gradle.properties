org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=false
org.gradle.configuration-cache=true

# Standalone (non-AOSP) build identity. Must differ from com.android.gallery3d,
# which the system Gallery2 already owns on the device.
GALLERY_APPLICATION_ID=org.gallery2.fork

# AOSP sources use R.id.* in switch statements; keep R fields final.
android.nonFinalResIds=false
